# The claim this repository makes is "every suite green together". Until now
# that claim had exactly one witness: one laptop. This workflow is the second.
#
# Principle: the YAML holds no logic. Every job runs a script that also runs
# locally (`make ci-offline`, `make test-asan`), so a green check here and a
# green run there are the same claim rather than two similar-looking ones.
# Anything that needs a decision belongs in the script, where it can be read,
# tested and reverted like code.
#
# What CI cannot run, and why, is written down in docs/ENVELOPE.md: the
# mounted stages need a signed FSKit extension that a human approved in System
# Settings, and the pull suite needs hands on a USB stick. Those stay local
# under `make validate`. CI's job is to make everything else un-forgettable.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant,
# and macOS minutes are the scarce resource here (billed 10x on private
# repositories). Cancel the older run rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that needs nothing but the checkout, a compiler and e2fsprogs.
  core-macos:
    name: offline suites (macOS, arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The suites patch the pinned lwext4 commit; a shallow submodule with no
      # history still has the pinned tree, which is all check_patches.sh reads.
      - name: toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          echo "SDK: $(xcrun --show-sdk-path)"
          cc --version | head -1

      - name: install e2fsprogs
        run: |
          brew install e2fsprogs
          echo "/opt/homebrew/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/e2fsprogs/bin" >> "$GITHUB_PATH"

      # Fixtures are generated by mke2fs and debugfs and take ~30s. They are a
      # pure function of the script that makes them, so key the cache on it.
      - name: cache fixtures
        uses: actions/cache@v4
        with:
          path: Tests/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('Tests/make_fixtures.sh') }}

      # A skipped stage on a runner is a mis-provisioned runner, not a
      # developer without Docker, so REQUIRE_ALL turns one red.
      - name: offline set
        run: REQUIRE_ALL=1 bash scripts/ci_offline.sh

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-macos-logs
          path: |
            build/ci/**
            build/*-report.txt
            .fuzz/findings/**
          if-no-files-found: ignore
          retention-days: 14

  # The same core, built -O0 with AddressSanitizer and UBSan, over the suites
  # whose whole point is memory unsafety. This is how the NULL dereference in
  # lwext4's xattr removal was found, and it is slow enough to deserve its own
  # job rather than doubling the length of the one above.
  asan-macos:
    name: sanitizers (macOS, arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install e2fsprogs
        run: |
          brew install e2fsprogs
          echo "/opt/homebrew/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/e2fsprogs/bin" >> "$GITHUB_PATH"

      # No fixture cache here on purpose: test-asan begins with `make clean`,
      # and a suite that regenerates its own fixtures is one more thing proven
      # to work from nothing.
      - name: sanitizer set
        run: make test-asan

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-macos-logs
          path: |
            build/*-report.txt
            .fuzz/findings/**
          if-no-files-found: ignore
          retention-days: 14
