# The claim this repository makes is "every suite green together". Until now
# that claim had exactly one witness: one laptop. This workflow is the second.
#
# Principle: the YAML holds no logic. Every job runs a script that also runs
# locally (`make ci-offline`, `make test-asan`), so a green check here and a
# green run there are the same claim rather than two similar-looking ones.
# Anything that needs a decision belongs in the script, where it can be read,
# tested and reverted like code.
#
# What CI cannot run, and why (docs/ENVELOPE.md will carry this in prose; it is
# Part C and not written yet): the
# mounted stages need a signed FSKit extension that a human approved in System
# Settings, and the pull suite needs hands on a USB stick. Those stay local
# under `make validate`. CI's job is to make everything else un-forgettable.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant,
# and macOS minutes are the scarce resource here (billed 10x on private
# repositories). Cancel the older run rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that needs nothing but the checkout, a compiler and e2fsprogs.
  core-macos:
    name: offline suites (macOS, arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # git 2.35+ refuses to operate on a working tree whose owner does not
      # match the user running git ("detected dubious ownership", exit 128),
      # and a GitHub runner's checkout trips exactly that in check_patches'
      # `git ls-tree`/`git archive`. Mark the workspace and its submodule
      # trusted. Harmless locally; the developer owns their own checkout.
      - name: trust the checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"

      # The suites patch the pinned lwext4 commit; a shallow submodule with no
      # history still has the pinned tree, which is all check_patches.sh reads.
      - name: toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          echo "SDK: $(xcrun --show-sdk-path)"
          cc --version | head -1

      - name: install e2fsprogs
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install e2fsprogs
          echo "/opt/homebrew/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/e2fsprogs/bin" >> "$GITHUB_PATH"

      # Fixtures are generated by mke2fs and debugfs and take ~30s. They are a
      # pure function of the script that makes them, so key the cache on it.
      - name: cache fixtures
        uses: actions/cache@v4
        with:
          path: Tests/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('Tests/make_fixtures.sh') }}

      # A skipped stage on a runner is a mis-provisioned runner, not a
      # developer without Docker, so REQUIRE_ALL turns one red.
      - name: offline set
        run: REQUIRE_ALL=1 bash scripts/ci_offline.sh

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-macos-logs
          path: |
            build/ci/**
            build/*-report.txt
            .fuzz/findings/**
          if-no-files-found: ignore
          retention-days: 14

  # The same core, built -O0 with AddressSanitizer and UBSan, over the suites
  # whose whole point is memory unsafety. This is how the NULL dereference in
  # lwext4's xattr removal was found, and it is slow enough to deserve its own
  # job rather than doubling the length of the one above.
  asan-macos:
    name: sanitizers (macOS, arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # git 2.35+ refuses to operate on a working tree whose owner does not
      # match the user running git ("detected dubious ownership", exit 128),
      # and a GitHub runner's checkout trips exactly that in check_patches'
      # `git ls-tree`/`git archive`. Mark the workspace and its submodule
      # trusted. Harmless locally; the developer owns their own checkout.
      - name: trust the checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"

      - name: install e2fsprogs
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install e2fsprogs
          echo "/opt/homebrew/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/e2fsprogs/bin" >> "$GITHUB_PATH"

      # No fixture cache here on purpose: test-asan begins with `make clean`,
      # and a suite that regenerates its own fixtures is one more thing proven
      # to work from nothing.
      - name: sanitizer set
        run: make test-asan

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-macos-logs
          path: |
            build/*-report.txt
            .fuzz/findings/**
          if-no-files-found: ignore
          retention-days: 14

  # The second opinion. Everything above is this project judging itself: our
  # reader against our writer, our checksums against our checksums. This job is
  # the one that asks somebody else -- the Linux kernel's own ext4, which is
  # the implementation every one of these volumes will eventually meet.
  #
  # It runs the five suites that need a kernel, and it runs them natively:
  # EXT4_ORACLE=local, so in_linux() calls sudo rather than docker. On a
  # developer's Mac the same five reach a kernel through a privileged
  # container; here the runner IS the kernel, which is both faster and one
  # fewer layer between the claim and the thing judging it.
  #
  # This is also the only place the tools are built with gcc and without
  # -target, so a size-of-long or byte-order mistake in the shim has somewhere
  # to show up.
  linux-oracle:
    name: the kernel's opinion (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # git 2.35+ refuses to operate on a working tree whose owner does not
      # match the user running git ("detected dubious ownership", exit 128),
      # and a GitHub runner's checkout trips exactly that in check_patches'
      # `git ls-tree`/`git archive`. Mark the workspace and its submodule
      # trusted. Harmless locally; the developer owns their own checkout.
      - name: trust the checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"

      # cryptsetup for the LUKS fixtures, attr for the xattr and chattr checks
      # in the differential suite, libssl-dev because Core/crypto reaches
      # OpenSSL on Linux where it reaches CommonCrypto on macOS. e2fsprogs and
      # python3 are already on the image; ask for them anyway, so that the day
      # they are not is a clear apt failure and not a suite skipping.
      - name: install the oracle's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs cryptsetup-bin attr libssl-dev python3
          echo "--- versions ---"
          gcc --version | head -1
          mke2fs -V 2>&1 | head -1
          cryptsetup --version

      # Loop devices and device-mapper are what "the kernel is the oracle"
      # actually means here. If a future runner image stops providing them,
      # this fails in three lines instead of inside a mount in a sweep.
      - name: the runner can loop-mount and map devices
        run: |
          sudo modprobe loop || true
          sudo modprobe dm_crypt || true
          truncate -s 16M /tmp/probe.img
          mkfs.ext4 -q /tmp/probe.img
          mkdir -p /tmp/probe.mnt
          sudo mount -o loop /tmp/probe.img /tmp/probe.mnt
          sudo umount /tmp/probe.mnt
          echo "loop mounts work"

      - name: cache fixtures
        uses: actions/cache@v4
        with:
          path: Tests/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('Tests/make_fixtures.sh') }}

      # A skipped stage here means the runner is missing something the step
      # above was supposed to install, so REQUIRE_ALL turns one red.
      - name: oracle set
        run: REQUIRE_ALL=1 bash scripts/ci_linux.sh

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-oracle-logs
          path: |
            build/ci-linux/**
            build/*-report.txt
          if-no-files-found: ignore
          retention-days: 14

  # The in-process fuzzer, which the other two jobs deliberately do not run:
  # it needs a libFuzzer runtime, and a runner without one must not be able to
  # turn the whole matrix red. scripts/fuzz_build.sh exits 77 rather than
  # failing when the runtime is absent, and this job treats that as a skip.
  #
  # Five minutes per mode is not a campaign, it is a smoke test: enough to
  # prove the harness still builds, still mounts, and still reaches the code
  # the coverage gate names. The real campaigns are the nightly and the
  # developer's soak, which run with a corpus that has been growing for weeks.
  fuzz-macos:
    name: fuzzer smoke (macOS, arm64)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # git 2.35+ refuses to operate on a working tree whose owner does not
      # match the user running git ("detected dubious ownership", exit 128),
      # and a GitHub runner's checkout trips exactly that in check_patches'
      # `git ls-tree`/`git archive`. Mark the workspace and its submodule
      # trusted. Harmless locally; the developer owns their own checkout.
      - name: trust the checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"

      - name: install e2fsprogs
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install e2fsprogs
          echo "/opt/homebrew/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/e2fsprogs/bin" >> "$GITHUB_PATH"

      # Xcode's clang on the runner ships libclang_rt.fuzzer_osx.a, which
      # Apple's Command Line Tools clang does not. If that ever stops being
      # true, Homebrew LLVM is the fallback and the build script says so.
      - name: pick a compiler with a libFuzzer runtime
        id: cc
        run: |
          for cc in "$(xcrun -f clang)" /opt/homebrew/opt/llvm/bin/clang; do
            [ -x "$cc" ] || continue
            rt="$("$cc" -print-libgcc-file-name 2>/dev/null)" || continue
            if [ -f "$(dirname "$rt")/libclang_rt.fuzzer_osx.a" ]; then
              echo "found $cc"
              echo "fuzz_cc=$cc" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no compiler here ships a libFuzzer runtime; installing llvm"
          brew install llvm
          echo "fuzz_cc=/opt/homebrew/opt/llvm/bin/clang" >> "$GITHUB_OUTPUT"

      # The corpus is the point of running this repeatedly. Keyed on the
      # branch so a pull request grows its own, with restore-keys falling back
      # to master's -- a new branch inherits weeks of exploration instead of
      # starting from the seeds.
      - name: cache the corpus
        uses: actions/cache@v4
        with:
          path: .fuzz/corpus
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            fuzz-corpus-${{ github.ref_name }}-
            fuzz-corpus-master-

      - name: build the harness
        run: |
          set +e
          FUZZ_CC='${{ steps.cc.outputs.fuzz_cc }}' bash scripts/fuzz_build.sh
          rc=$?
          set -e
          if [ "$rc" -eq 77 ]; then
            echo "SKIP: no libFuzzer runtime on this runner"
            echo "skip=1" >> "$GITHUB_ENV"
            exit 0
          fi
          exit "$rc"

      # `|| true`, deliberately: libFuzzer exits non-zero for a crash AND for
      # an out-of-memory that is really the corpus being large. The
      # fuzz-check step below is the judge, and it can tell them apart.
      - name: five minutes each way
        if: env.skip != '1'
        run: |
          make fuzz    FUZZ_TIME=300 FUZZ_JOBS=2 || true
          make fuzz-rw FUZZ_TIME=300 FUZZ_JOBS=2 || true

      # The gate, not the campaign: a run that found nothing because it
      # reached nothing looks identical to a clean one without this.
      - name: coverage gate
        if: env.skip != '1'
        run: bash scripts/fuzz_coverage.sh

      # `make fuzz` already exits non-zero when libFuzzer reports a crash, but
      # a crash found by one -jobs worker can leave the artifact behind while
      # the parent still exits 0. Ask the directory -- through the same target
      # the soak uses, so the two decide the same way. It distinguishes an
      # artifact with an input (a finding) from a zero-byte one (libFuzzer ran
      # out of room for the corpus, which is nothing to reproduce).
      - name: any artifact with an input is a failure
        if: always() && env.skip != '1'
        run: make fuzz-check

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-macos-artifacts
          path: |
            .fuzz/crashes/**
            .fuzz/logs/**
            .fuzz/cov/print-*.txt
          if-no-files-found: ignore
          retention-days: 14
