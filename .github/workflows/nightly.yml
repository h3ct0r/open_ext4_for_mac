# What a five-minute smoke test cannot say.
#
# ci.yml answers "did this change break anything", on every push, in
# minutes. This answers a different question: does it still hold up when it
# is left running. The fuzzer needs hours to reach anything the seeds do not,
# and a soak's whole product is "nothing found in N rounds" -- neither is
# worth doing on a pull request, and both are worth doing every night.
#
# What it cannot do is the mounted half. Stages 9 to 13 need a signed FSKit
# extension that a person approved in System Settings, and the pull suite
# needs hands on a USB stick. Those stay on the developer's Mac under
# `make validate` and `make soak`; docs/ENVELOPE.md says so in prose. This is
# the offline set, over and over, with the fuzzer between rounds.
#
# A red night files itself: the last job opens (or comments on) an issue
# labelled `nightly`, and the next green night closes it. The first red night
# with a real crash in it went eight days without anyone looking.
name: nightly

on:
  schedule:
    # 03:00 UTC. Late enough that the day's pushes have settled, early enough
    # that the results are there before anyone looks.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: seconds of fuzzing per mode
        default: '3600'

# One nightly at a time: two campaigns restoring and saving the same corpus
# would each prune the other's cache.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # An hour each way, against a corpus that has been growing since the last
  # nightly. This is the run that finds things; ci.yml's five minutes is the
  # run that proves the instrument still works.
  long-fuzz:
    name: an hour each way
    runs-on: macos-26
    # Two hours of fuzzing, two merges, the coverage replay and the cache.
    # The first run after the corpus reset merges ~90 GB and needs the room.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write    # prune superseded corpus caches
    # A hosted macos-26 runner has 3 vCPUs and 7 GB for everything. Three
    # jobs at 4 GB each and an 8 GB merge is how four runners were lost.
    env:
      FUZZ_TIME: ${{ inputs.fuzz_time || '3600' }}
      FUZZ_JOBS: 2
      FUZZ_RSS_MB: 2560
      FUZZ_MERGE_RSS_MB: 4096
      FUZZ_CORPUS_BUDGET_MB: 1024
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-macos

      - name: pick a compiler with a libFuzzer runtime
        id: cc
        uses: ./.github/actions/pick-fuzz-cc

      # The nightly corpus is the only one that accumulates; ci.yml reads it
      # and never writes. Restore and save are separate steps so a red night
      # can still keep what it learned, and the key carries the run id
      # because actions/cache has no update-in-place. The second restore key
      # is the pre-v2 corpus, read once so its coverage survives the reset.
      - name: restore the corpus
        uses: actions/cache/restore@v6
        with:
          path: .fuzz/corpus
          key: fuzz-corpus-v2-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-v2-
            fuzz-corpus-nightly-

      - name: build the harness
        run: FUZZ_CC='${{ steps.cc.outputs.fuzz_cc }}' bash scripts/fuzz_build.sh

      # Distil, fuzz ro, fuzz rw, distil, hold the corpus to its budget.
      # scripts/ci_nightly_fuzz.sh says why each of those is there.
      - name: the campaign
        id: campaign
        run: bash scripts/ci_nightly_fuzz.sh campaign

      - name: coverage gate
        if: always() && steps.campaign.outcome != 'skipped'
        run: bash scripts/fuzz_coverage.sh

      - name: any artifact with an input is a failure
        if: always()
        run: make fuzz-check

      # Only a corpus that merged and fits its budget is kept, and keeping it
      # retires every other corpus cache: one entry, not one per night.
      - name: save the corpus
        id: save
        if: always() && steps.campaign.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .fuzz/corpus
          key: fuzz-corpus-v2-${{ github.run_id }}

      - name: prune superseded corpora
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci_nightly_fuzz.sh prune fuzz-corpus-v2-${{ github.run_id }}

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fuzz
          path: |
            .fuzz/crashes/**
            .fuzz/logs/**
            .fuzz/cov/print-*.txt
          if-no-files-found: ignore
          retention-days: 30

  # The offline set, three times, with ten minutes of fuzzing between rounds.
  # A suite that has passed once tells you it can pass; a suite that has
  # passed repeatedly, on a machine in different states, tells you something
  # else. Three rounds is what fits in a nightly; the developer's soak runs
  # for days and is where the number in docs/notebook/soak.md comes from.
  offline-soak:
    name: offline soak
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-macos

      - name: pick a compiler with a libFuzzer runtime
        id: cc
        uses: ./.github/actions/pick-fuzz-cc

      - name: soak
        run: |
          FUZZ_CC='${{ steps.cc.outputs.fuzz_cc }}' \
          SOAK_ROUNDS=3 bash scripts/soak.sh --offline --fuzz 10

      - name: sanitizers
        run: make test-asan

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-soak
          path: |
            .soak/**
            .fuzz/crashes/**
            .fuzz/logs/**
            build/ci/**
          if-no-files-found: ignore
          retention-days: 30

  # The night's verdict, where a person will see it: one open issue labelled
  # `nightly` while it is red, closed by the next green night. Schedule only;
  # a dispatched run is somebody already looking.
  report:
    name: file the night
    needs: [long-fuzz, offline-soak]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FUZZ_RESULT: ${{ needs.long-fuzz.result }}
          SOAK_RESULT: ${{ needs.offline-soak.result }}
        run: bash scripts/ci_nightly_report.sh
